[package]
name = "edge-rs"
version = "0.0.1"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
description = "Negative binomial differential expression for bulk and single-cell RNA-seq: the edgeR numerical stack and NEBULA mixed models."
repository = "https://github.com/GregorLueg/edge-rs"
keywords = ["bioinformatics", "rna-seq", "statistics", "single-cell", "glm"]
categories = ["science", "mathematics"]

[lib]
name = "edge_rs"
path = "src/lib.rs"

[dependencies]
faer = "0.23.2"
faer-traits = "0.23.2"
num-traits = "0.2.19"
rayon = "1.11.0"
rustc-hash = "2.1.1"
statrs = "0.18.0"
thiserror = "2.0.18"
wide = "1.4.0"

[dev-dependencies]
approx = "0.5.1"
rand = "0.9.2"
rand_distr = "0.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
