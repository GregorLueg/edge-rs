[package]
name = "edge-rs"
version = "0.1.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
description = "Negative binomial differential expression for bulk and single-cell RNA-seq: the edgeR numerical stack and NEBULA mixed models."
repository = "https://github.com/GregorLueg/edge-rs"
keywords = ["bioinformatics", "rna-seq", "statistics", "single-cell", "glm"]
categories = ["science", "mathematics"]

[lib]
name = "edge_rs"
path = "src/lib.rs"

[features]
## Default build: pure CPU, no GPU runtime.
default = []
## Enables the CubeCL/wgpu NEBULA path in `crate::gpu`.
gpu = ["cubecl", "cubecl-utils-rs"]
## Enables the tests that need a wgpu adapter on the machine. This is for CI/CD
gpu-tests = ["gpu"]

[dependencies]
cubecl = { version = "0.10.0", features = ["wgpu"], optional = true }
cubecl-utils-rs = { version = "0.1.0", optional = true }
faer = "0.23.2"
faer-traits = "0.23.2"
num-traits = "0.2.19"
rayon = "1.11.0"
rustc-hash = "2.1.1"
statrs = "0.18.0"
thiserror = "2.0.18"
wide = "1.4.0"

[dev-dependencies]
approx = "0.5.1"
rand = "0.9.2"
rand_distr = "0.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

###########
# Benches #
###########

[[bench]]
name = "nebula_bench"
harness = false

[[bench]]
name = "nebula_gpu_bench"
harness = false
required-features = ["gpu"]
