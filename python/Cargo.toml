# Own workspace root, deliberately. The crate at the repository root is
# published to crates.io and must not see this path-dependent sibling, and a
# root `cargo test` should not build pyo3.
[workspace]

[package]
name = "edge-rs-py"
description = "Python bindings for edge-rs"
version = "0.1.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
publish = false

[lib]
name = "_edge_rs"
crate-type = ["cdylib"]

[dependencies]
edge-rs = { path = ".." }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
