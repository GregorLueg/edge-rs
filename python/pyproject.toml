[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "edge-rs"
description = "edgeR and limma-voom differential expression for Python, in Rust."
license = { text = "MIT" }
authors = [{ name = "Gregor Lueg", email = "gregorlueg@me.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "beartype>=0.19",
    "polars>=1.0",
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/GregorLueg/edge-rs"

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1",
]
# mkdocstrings reads the installed package, so a docs build needs the compiled
# extension present: `maturin develop --release` before `mkdocs build`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
# Executes `docs/vignettes/*.py` into their `.ipynb` twins: `dev/vignettes.py`.
vignettes = [
    "bixverse>=0.3.2",
    "click>=8.1",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.maturin]
module-name = "edge_rs._edge_rs"
python-source = "."
strip = true
include = ["edge_rs/py.typed", "edge_rs/*.pyi"]
exclude = ["**/__pycache__/**"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a notebook cell is its displayed output;
# markdown tables cannot wrap.
"docs/vignettes/*.py" = ["B018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["edge_rs"]

[tool.ty.src]
# The executed notebooks are generated from the jupytext sources next to them,
# so checking both reports every diagnostic twice.
exclude = ["**/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
