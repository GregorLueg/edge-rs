[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "edge-rs"
description = "edgeR and limma-voom differential expression for Python, in Rust."
license = { text = "MIT" }
authors = [{ name = "Gregor Lueg", email = "gregorlueg@me.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "beartype>=0.19",
    "polars>=1.0",
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/GregorLueg/edge-rs"

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[tool.maturin]
module-name = "edge_rs._edge_rs"
python-source = "."
strip = true
include = ["edge_rs/py.typed", "edge_rs/*.pyi"]
exclude = ["**/__pycache__/**"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["edge_rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
