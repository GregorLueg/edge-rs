name: Intel macOS GPU probe

on:
  push:
    branches: [ fix-old-mac ]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-gpu

      - name: Adapter
        if: runner.os == 'macOS'
        run: system_profiler SPDisplaysDataType

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - name: Plane layout probe
        continue-on-error: true
        run: cargo test --release --features gpu-tests --test plane_probe -- --nocapture

      - name: GPU NEBULA suite
        run: cargo test --release --features gpu-tests --test e2e_nebula_gpu -- --nocapture --test-threads=1
